[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "anchored-moe"
version = "0.1.0.dev0"
description = "Anchored plug-in mixture-of-experts research framework"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Mutations contributors" }]
dependencies = [
    "accelerate>=1.1",
    "safetensors>=0.4",
    "torch>=2.2",
    "transformers>=4.51,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
anchored_moe = ["*/README.md"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
