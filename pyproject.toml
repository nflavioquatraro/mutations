[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "anchored-moe"
version = "0.1.0.dev0"
description = "Modular MoE and LoRA routing for frozen language models with exact base-model fallback"
keywords = ["mixture-of-experts", "lora", "llm", "expert-routing", "frozen-backbone", "qwen3"]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Mutations contributors" }]
dependencies = [
    "accelerate>=1.1",
    "huggingface-hub>=0.34,<2",
    "peft>=0.18.1,<1",
    "safetensors>=0.4",
    "torch>=2.2",
    "transformers>=4.51,<6",
]

[project.urls]
Homepage = "https://nflavioquatraro.github.io/mutations/"
Documentation = "https://nflavioquatraro.github.io/mutations/docs/"
Repository = "https://github.com/nflavioquatraro/mutations"
Issues = "https://github.com/nflavioquatraro/mutations/issues"

[project.optional-dependencies]
needle = [
    "cactus-needle==3.0.4",
    "jax>=0.4.38,<0.12",
    "flax>=0.10.2,<0.13",
    "optax>=0.2.4,<0.3",
]
dev = [
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
anchored_moe = ["*/README.md", "branching/browser/*.mjs", "branching/browser/*.js"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
